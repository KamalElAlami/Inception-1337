  volumes:
    mariadb_vol:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: /home/dedsec/Inception-1337/mariadb_volume
    wordpress_vol:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: /home/dedsec/Inception-1337/wordpress_volume

  networks:
    network_type:
      driver: bridge
  services:
    nginx:
      build: ./requirements/nginx
      ports:
        - "443:443"
      networks:
        - network_type
      volumes:
        - wordpress_vol:/var/www/html
      restart: on-failure
      depends_on:
        - wordpress
    mariadb:
      build: ./requirements/mariadb
      ports:
        - "3306:3306"
      env_file:
        - .env
      networks:
        - network_type
      volumes:
        - mariadb_vol:/var/lib/mysql
      restart: on-failure
    wordpress:
      build: ./requirements/wordpress
      ports:
        - "9000:9000"
      env_file:
        - .env
      networks:
        - network_type
      volumes:
        - wordpress_vol:/var/www/html
      restart: on-failure
      depends_on:
        - mariadb
    adminer:
      build: ./requirements/bonus/adminer
      ports:
        - "2000:2000"
      env_file:
        - .env
      networks:
        - network_type
      # restart: 
      #   - on-failure
      # depands_on:
      #   - mariadb
    redis:
      build: ./requirements/bonus/redis
      ports:
        - "6380:6380"
      env_file:
        - .env
      networks:
        - network_type
      # restart: 
      #   - on-failure
      # depands_on:
      #   mariadb