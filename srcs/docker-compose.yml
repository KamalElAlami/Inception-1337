  volumes:
    mariadb_vol:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ${HOME}/data/mariadb
    wordpress_vol:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ${HOME}/data/wordpress
    portainer_data:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ${HOME}/data/portainer

  networks:
    network_type:
      driver: bridge

  services:
    nginx:
      container_name: nginx
      image: nginx:mine
      build: ./requirements/nginx
      ports:
        - "443:443"
      networks:
        - network_type
      volumes:
        - wordpress_vol:/var/www/html
      restart: on-failure
      depends_on:
        - wordpress
    mariadb:
      container_name: mariadb
      image: mariadb:mine
      build: ./requirements/mariadb
      env_file:
        - .env
      networks:
        - network_type
      volumes:
        - mariadb_vol:/var/lib/mysql
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s
      restart: on-failure
    wordpress:
      container_name: wordpress
      image: wordpress:mine
      build: ./requirements/wordpress
      env_file:
        - .env
      networks:
        - network_type
      volumes:
        - wordpress_vol:/var/www/html
      healthcheck:
        test: ["CMD", "php-fpm8.2", "-t"]
        interval: 10s
        timeout: 5s
        retries: 5
      restart: on-failure
      depends_on:
        redis:
          condition: service_healthy
        mariadb:
          condition: service_healthy
    adminer:
      container_name: adminer
      image: adminer:mine
      build: ./requirements/bonus/adminer
      ports:
        - "2000:2000"
      env_file:
        - .env
      networks:
        - network_type
      restart: on-failure
      depends_on:
        mariadb:
          condition: service_healthy
    redis:
      container_name: redis
      image: redis:mine
      build: ./requirements/bonus/redis
      ports:
        - "6380:6380"
      env_file:
        - .env
      networks:
        - network_type
      restart: on-failure
      healthcheck:
        test: ["CMD", "redis-cli", "-p", "6380", "ping"]
        interval: 10s
        timeout: 5s
        retries: 10
    ftp:
      container_name: ftp
      image: ftp:mine
      build: ./requirements/bonus/ftp
      ports:
        - "21:21"
        - "21000-21010:21000-21010"  
      networks:
        - network_type
      volumes:
        - wordpress_vol:/uploads
      env_file:
        - .env
      restart: on-failure
      depends_on:
        - wordpress
    portainer:
      container_name: portainer
      image: portainer:mine
      build: ./requirements/bonus/portainer
      ports:
        - "9443:9443"
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - portainer_data:/data
      networks:
        - network_type
      restart: on-failure
    website:
      container_name: website.env.example
      image: website:mine
      build: ./requirements/bonus/website
      ports:
        - "8080:80"
      networks:
        - network_type
      restart: on-failure